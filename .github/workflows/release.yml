name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: personal-dashboard-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/*.zip dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/*.zip dist/SHA256SUMS.txt --title "Personal Dashboard $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
